name: Report a model problem
description: Report geometry, placement metadata, credit or viewer problems.
title: "Model: "
body:
  - type: input
    id: asset
    attributes:
      label: Asset ID or library URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what should happen?
      description: Include the view, near/far detail, GLB/procedural source, browser and steps to reproduce. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - Standalone library / GLB viewer
        - Cityscape (flat ground)
        - Full 3D world (topography)
        - Another application
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reference or attribution evidence
      description: Link source photos, dimensions or license information if relevant. Do not include account details or private routes.
